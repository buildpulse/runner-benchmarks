name: docker-build
# PostHog's production image at a pinned commit, built with buildx and no
# cache. BuildPulse side is the docker-builder runner. Five jobs per runner,
# run at once. Timed steps are named "phase: ..."; scripts/medians.py sums
# them per job.
on:
  workflow_dispatch:
    inputs:
      note:
        description: batch label
        required: false

permissions:
  contents: read

jobs:
  docker:
    name: docker ${{ matrix.runner }} ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, bp-docker-builder-x64-4x]
        iteration: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      POSTHOG_SHA: ba81ecf8f5bccbaee4ec5a1613780e0acfd7585b
    steps:
      - name: Make room
        # The build needs about 40 GB. Runners with less free space get the
        # usual cleanup first; not timed.
        run: |
          root=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || true)
          [ -d "$root" ] || root=/
          free=$(df -BG --output=avail "$root" | tail -1 | tr -dc 0-9)
          echo "free at $root: ${free}G"
          if [ "$free" -lt 40 ]; then
            sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
            df -h "$root"
          fi
      - name: "phase: fetch source"
        run: |
          mkdir posthog && cd posthog
          git init -q
          git remote add origin https://github.com/PostHog/posthog.git
          git fetch -q --depth=1 --no-tags origin "$POSTHOG_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$POSTHOG_SHA"
      - name: "phase: buildx setup"
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: "phase: docker build"
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: posthog
          outputs: type=cacheonly
          no-cache: true
          provenance: false
          sbom: false
