name: rust
# spotify-player at a pinned commit: cargo fmt check, tests, and clippy with
# the same feature set on both runners. Five jobs per runner, run at once.
# Timed steps are named "phase: ..."; scripts/medians.py sums them per job.
on:
  workflow_dispatch:
    inputs:
      note:
        description: batch label
        required: false

permissions:
  contents: read

jobs:
  rust:
    name: rust ${{ matrix.runner }} ${{ matrix.iteration }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, bp-ubuntu-latest-x64-4x]
        iteration: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      FEATURES: "rodio-backend,media-control,image,notify,fzf"
    steps:
      - name: "phase: checkout"
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: aome510/spotify-player
          ref: 7dc9d17a7bf5671eb6129fdf9127729f659637fc
          persist-credentials: false
      - name: "phase: system packages"
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config libssl-dev libasound2-dev libdbus-1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev
      - name: "phase: toolchain"
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-30
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: "phase: cargo fmt"
        run: cargo fmt --all -- --check
      - name: "phase: cargo test"
        run: cargo test --no-default-features --features "$FEATURES"
      - name: "phase: cargo clippy"
        run: cargo clippy --no-default-features --features "$FEATURES" -- -D warnings
      - name: "phase: cargo clippy (no features)"
        run: cargo clippy --no-default-features -- -D warnings
