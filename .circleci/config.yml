# CircleCI Linux VM (large, large.gen2; 4 vCPU) vs BuildPulse x64-4x on CircleCI.
# Generated by scripts/gen-vendor-configs.py; do not hand-edit.
version: 2.1

parameters:
  bp_resource_class:
    type: string
    default: your-namespace/bp-x64-4x

executors:
  bp-4x:
    machine: true
    resource_class: << pipeline.parameters.bp_resource_class >>
  cci-4x:
    machine:
      image: ubuntu-2404:current
    resource_class: large
  cci-gen2-4x:
    machine:
      image: ubuntu-2404:current
    resource_class: large.gen2

jobs:
  node-build:
    parameters:
      ex:
        type: executor
    executor: << parameters.ex >>
    steps:
      - run:
          name: toolchain
          command: |
            mkdir -p "$HOME/bench-tools" && cd "$HOME/bench-tools"
            curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz | tar -xJ
            curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz | tar -xz
            echo "nproc=$(nproc) mem_mb=$(free -m | awk '/Mem:/{print $2}') cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
      - run:
          name: clone
          no_output_timeout: 30m
          command: |
            export PATH="$HOME/bench-tools/node-v20.18.1-linux-x64/bin:$HOME/bench-tools/go/bin:$PATH" GOROOT="$HOME/bench-tools/go" GOTOOLCHAIN=local GOCACHE="$HOME/bench-tools/gocache" GOPATH="$HOME/bench-tools/gopath" COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            rm -rf ~/bench-work && mkdir -p ~/bench-work && cd ~/bench-work && git clone -q --depth 1 --branch v3.5.13 https://github.com/vuejs/core vue
      - run:
          name: install
          no_output_timeout: 30m
          command: |
            export PATH="$HOME/bench-tools/node-v20.18.1-linux-x64/bin:$HOME/bench-tools/go/bin:$PATH" GOROOT="$HOME/bench-tools/go" GOTOOLCHAIN=local GOCACHE="$HOME/bench-tools/gocache" GOPATH="$HOME/bench-tools/gopath" COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            cd ~/bench-work/vue && npm install -g --silent pnpm@$(node -p "require('./package.json').packageManager.split('@')[1].split('+')[0]") && pnpm install --frozen-lockfile
      - run:
          name: build
          no_output_timeout: 30m
          command: |
            export PATH="$HOME/bench-tools/node-v20.18.1-linux-x64/bin:$HOME/bench-tools/go/bin:$PATH" GOROOT="$HOME/bench-tools/go" GOTOOLCHAIN=local GOCACHE="$HOME/bench-tools/gocache" GOPATH="$HOME/bench-tools/gopath" COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            cd ~/bench-work/vue && pnpm build
      - run:
          name: test
          no_output_timeout: 30m
          command: |
            export PATH="$HOME/bench-tools/node-v20.18.1-linux-x64/bin:$HOME/bench-tools/go/bin:$PATH" GOROOT="$HOME/bench-tools/go" GOTOOLCHAIN=local GOCACHE="$HOME/bench-tools/gocache" GOPATH="$HOME/bench-tools/gopath" COREPACK_ENABLE_DOWNLOAD_PROMPT=0
            cd ~/bench-work/vue && pnpm test-unit
  go-build:
    parameters:
      ex:
        type: executor
    executor: << parameters.ex >>
    steps:
      - run:
          name: toolchain
          command: |
            mkdir -p "$HOME/bench-tools" && cd "$HOME/bench-tools"
            curl -fsSL https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz | tar -xJ
            curl -fsSL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz | tar -xz
            echo "nproc=$(nproc) mem_mb=$(free -m | awk '/Mem:/{print $2}') cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)"
      - run:
          name: clone
          no_output_timeout: 30m
